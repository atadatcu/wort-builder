name: Build Wort from GitLab

permissions:
  contents: write

on:
  repository_dispatch:
    types: [build-warplite]  # keep so existing GitLab trigger still works
  workflow_dispatch:
    inputs:
      ref:
        description: "GitLab branch/tag"
        required: false
        default: "feature/rebrand-wort"

concurrency:
  group: wort-macos
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 180

    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      GITLAB_REF: ${{ github.event.client_payload.ref || inputs.ref || 'feature/rebrand-wort' }}
      GITLAB_SHA: ${{ github.event.client_payload.sha || '' }}

    steps:
      - name: Clone public GitLab source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITLAB_REF" \
            https://gitlab.com/adatcu/warp-lite.git src \
            || {
              git clone --depth 50 https://gitlab.com/adatcu/warp-lite.git src
              cd src && git checkout "$GITLAB_REF"
            }
          cd src
          if [ -n "${GITLAB_SHA}" ]; then
            git fetch --depth 1 origin "$GITLAB_SHA"
            git checkout --force "$GITLAB_SHA"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Building $(git rev-parse --short HEAD) ($(git log -1 --pretty=%s))"

      - name: Install build dependencies and pull LFS
        working-directory: src
        run: |
          brew install protobuf git-lfs
          git lfs install
          git lfs pull
          protoc --version

      - name: Rust toolchain
        working-directory: src
        run: |
          CHANNEL=$(grep -E '^\s*channel\s*=' rust-toolchain.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup default "$CHANNEL"
          rustc -V && cargo -V

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: wort-${{ runner.os }}-${{ hashFiles('src/Cargo.lock', 'src/rust-toolchain.toml') }}
          restore-keys: |
            wort-${{ runner.os }}-
            warplite-${{ runner.os }}-

      - name: Release build
        working-directory: src
        run: cargo build --release --bin warp-oss

      - name: Bundle Wort.app and DMG
        working-directory: src
        run: |
          script/build-warp-lite-app.sh
          codesign --verify --deep --strict --verbose=2 Wort.app || true
          rm -f Wort.dmg Wort.app.zip
          hdiutil create -volname Wort -srcfolder Wort.app -ov -format UDZO Wort.dmg
          ditto -c -k --sequesterRsrc --keepParent Wort.app Wort.app.zip
          hdiutil verify Wort.dmg || true
          ls -lh Wort.app Wort.dmg Wort.app.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wort-${{ github.run_number }}
          path: |
            src/Wort.app.zip
            src/Wort.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Checksums
        working-directory: src
        run: |
          shasum -a 256 Wort.app.zip Wort.dmg | tee checksums.txt
          {
            echo "## Wort CI build"
            echo
            echo "- GitLab ref: \`${GITLAB_REF}\`"
            echo "- GitLab SHA: \`${SOURCE_SHA}\`"
            echo "- GitHub run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "### SHA256"
            echo '```'
            cat checksums.txt
            echo '```'
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wort-${{ github.run_number }}-${{ env.SOURCE_SHA_SHORT }}
          name: Wort ${{ env.GITLAB_REF }} (${{ env.SOURCE_SHA_SHORT }})
          body_path: src/release-body.md
          files: |
            src/Wort.app.zip
            src/Wort.dmg
            src/checksums.txt
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
