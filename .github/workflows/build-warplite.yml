name: Build Wort from GitLab

permissions:
  contents: write

on:
  repository_dispatch:
    types: [build-warplite] # keep so existing GitLab trigger still works
  workflow_dispatch:
    inputs:
      ref:
        description: "GitLab branch/tag"
        required: false
        default: "main/warp-lite"

concurrency:
  group: wort-macos
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 180

    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "4"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      GITLAB_REF: ${{ github.event.client_payload.ref || inputs.ref || 'main/warp-lite' }}
      GITLAB_SHA: ${{ github.event.client_payload.sha || '' }}

    steps:
      - name: Clone public GitLab source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITLAB_REF" \
            https://gitlab.com/adatcu/wort.git src \
            || {
              git clone --depth 50 https://gitlab.com/adatcu/wort.git src
              cd src && git checkout "$GITLAB_REF"
            }
          cd src
          if [ -n "${GITLAB_SHA}" ]; then
            git fetch --depth 1 origin "$GITLAB_SHA"
            git checkout --force "$GITLAB_SHA"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "Building $(git rev-parse --short HEAD) ($(git log -1 --pretty=%s))"

      - name: Set Homebrew-friendly version
        run: |
          # Plain integer version → tag vN, cask version "N"
          echo "WORT_VERSION=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Install build dependencies and pull LFS
        working-directory: src
        run: |
          brew install protobuf git-lfs
          git lfs install
          git lfs pull
          protoc --version

      - name: Rust toolchain
        working-directory: src
        run: |
          CHANNEL=$(grep -E '^\s*channel\s*=' rust-toolchain.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup default "$CHANNEL"
          rustc -V && cargo -V

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: wort-${{ runner.os }}-${{ hashFiles('src/Cargo.lock', 'src/rust-toolchain.toml') }}
          restore-keys: |
            wort-${{ runner.os }}-
            warplite-${{ runner.os }}-

      - name: Release build
        working-directory: src
        run: cargo build --release --bin warp-oss

      - name: Bundle Wort.app and DMG
        working-directory: src
        run: |
          script/build-warp-lite-app.sh
          codesign --verify --deep --strict --verbose=2 Wort.app || true
          rm -f Wort.dmg Wort.app.zip
          hdiutil create -volname Wort -srcfolder Wort.app -ov -format UDZO Wort.dmg
          ditto -c -k --sequesterRsrc --keepParent Wort.app Wort.app.zip
          hdiutil verify Wort.dmg || true
          ls -lh Wort.app Wort.dmg Wort.app.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wort-${{ env.WORT_VERSION }}
          path: |
            src/Wort.app.zip
            src/Wort.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Checksums
        working-directory: src
        run: |
          shasum -a 256 Wort.app.zip Wort.dmg | tee checksums.txt
          DMG_SHA=$(shasum -a 256 Wort.dmg | awk '{print $1}')
          echo "DMG_SHA256=${DMG_SHA}" >> "$GITHUB_ENV"
          {
            echo "## Wort ${WORT_VERSION}"
            echo
            echo "- GitLab ref: \`${GITLAB_REF}\`"
            echo "- GitLab SHA: \`${SOURCE_SHA}\`"
            echo "- GitHub run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Homebrew: \`brew tap atadatcu/wort && brew install --cask wort\`"
            echo
            echo "### SHA256"
            echo '```'
            cat checksums.txt
            echo '```'
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Homebrew-friendly: v123 → cask version "123"
          tag_name: v${{ env.WORT_VERSION }}
          name: Wort ${{ env.WORT_VERSION }} (${{ env.SOURCE_SHA_SHORT }})
          body_path: src/release-body.md
          files: |
            src/Wort.app.zip
            src/Wort.dmg
            src/checksums.txt
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: auto-bump https://github.com/atadatcu/homebrew-wort
      # Create secret HOMEBREW_TAP_TOKEN (PAT with contents:write on that repo).
      - name: Bump Homebrew cask
        if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/atadatcu/homebrew-wort.git" tap
          cd tap
          mkdir -p Casks
          cat > Casks/wort.rb <<EOF
          cask "wort" do
            version "${WORT_VERSION}"
            sha256 "${DMG_SHA256}"

            url "https://github.com/${{ github.repository }}/releases/download/v#{version}/Wort.dmg"
            name "Wort"
            desc "Local-first terminal (fork of Warp Lite / WarpOss)"
            homepage "https://gitlab.com/adatcu/wort"

            app "Wort.app"

            livecheck do
              url "https://github.com/${{ github.repository }}/releases/latest"
              regex(%r{href=.*?/tag/v?(\\d+(?:\\.\\d+)*)}i)
            end

            caveats <<~EOS
              If macOS blocks the app (unsigned/unnotarized):
                xattr -cr /Applications/Wort.app
            EOS

            zap trash: [
              "~/Library/Application Support/dev.warp-lite.WarpLite",
            ]
          end
          EOF
          git config user.name "wort-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/wort.rb
          git diff --staged --quiet && echo "No cask changes" && exit 0
          git commit -m "wort ${WORT_VERSION}"
          git push
